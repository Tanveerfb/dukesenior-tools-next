<svg id="svg-sq-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&amp;family=Cinzel:wght@400;700');</style>
  <defs>
    <radialGradient id="sd-iris" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#A8D8F8"/>
      <stop offset="40%" stop-color="#4A9FE8"/>
      <stop offset="100%" stop-color="#3B1F6B"/>
    </radialGradient>
    <radialGradient id="sd-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A9FE8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B1F6B" stop-opacity="0"/>
    </radialGradient>
    <filter id="sd-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sd-glow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sd-bolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8D8F8"/>
      <stop offset="100%" stop-color="#7B3FC4"/>
    </linearGradient>
  </defs>
  <!-- aura glow -->
  <ellipse cx="100" cy="105" rx="70" ry="65" fill="url(#sd-aura)"/>
  <!-- arch -->
  <path d="M30 130 C30 55 55 28 100 24 C145 28 170 55 170 130" stroke="#4A9FE8" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#sd-glow)"/>
  <!-- eye -->
  <path d="M38 105 Q100 55 162 105 Q100 158 38 105Z" fill="#0D0A1A" stroke="#4A9FE8" stroke-width="2" filter="url(#sd-glow-sm)"/>
  <!-- iris -->
  <circle cx="100" cy="105" r="30" fill="url(#sd-iris)" filter="url(#sd-glow)"/>
  <!-- inner ring -->
  <circle cx="100" cy="105" r="30" fill="none" stroke="rgba(168,216,248,0.3)" stroke-width="1"/>
  <!-- pupil -->
  <circle cx="100" cy="105" r="13" fill="#0D0A1A"/>
  <!-- slit / cat pupil -->
  <ellipse cx="100" cy="105" rx="5" ry="12" fill="#060410"/>
  <!-- highlight -->
  <circle cx="107" cy="97" r="5.5" fill="rgba(255,255,255,0.75)"/>
  <circle cx="107" cy="97" r="2.5" fill="rgba(255,255,255,0.95)"/>
  <!-- bolt -->
  <path d="M88 170 L98 148 L92 148 L103 126" stroke="url(#sd-bolt)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#sd-glow)"/>
  <!-- eyebrow / arch accent lines -->
  <path d="M48 70 L62 80" stroke="#7B3FC4" stroke-width="2" stroke-linecap="round" filter="url(#sd-glow-sm)"/>
  <path d="M152 70 L138 80" stroke="#7B3FC4" stroke-width="2" stroke-linecap="round" filter="url(#sd-glow-sm)"/>
</svg>