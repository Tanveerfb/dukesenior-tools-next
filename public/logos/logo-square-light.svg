<svg id="svg-sq-light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&amp;family=Cinzel:wght@400;700');</style>
  <defs>
    <radialGradient id="sl-iris" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#3B1F6B"/>
      <stop offset="60%" stop-color="#4A9FE8"/>
      <stop offset="100%" stop-color="#0D0A1A"/>
    </radialGradient>
    <linearGradient id="sl-bolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B1F6B"/>
      <stop offset="100%" stop-color="#7B3FC4"/>
    </linearGradient>
  </defs>
  <!-- arch -->
  <path d="M30 130 C30 55 55 28 100 24 C145 28 170 55 170 130" stroke="#3B1F6B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- eye -->
  <path d="M38 105 Q100 55 162 105 Q100 158 38 105Z" fill="#EDE9FF" stroke="#3B1F6B" stroke-width="2"/>
  <!-- iris -->
  <circle cx="100" cy="105" r="30" fill="url(#sl-iris)"/>
  <circle cx="100" cy="105" r="30" fill="none" stroke="rgba(59,31,107,0.25)" stroke-width="1"/>
  <!-- pupil -->
  <circle cx="100" cy="105" r="13" fill="#0D0A1A"/>
  <ellipse cx="100" cy="105" rx="5" ry="12" fill="#060410"/>
  <circle cx="107" cy="97" r="5.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="107" cy="97" r="2.5" fill="rgba(255,255,255,0.9)"/>
  <!-- bolt -->
  <path d="M88 170 L98 148 L92 148 L103 126" stroke="url(#sl-bolt)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- brows -->
  <path d="M48 70 L62 80" stroke="#7B3FC4" stroke-width="2" stroke-linecap="round"/>
  <path d="M152 70 L138 80" stroke="#7B3FC4" stroke-width="2" stroke-linecap="round"/>
</svg>